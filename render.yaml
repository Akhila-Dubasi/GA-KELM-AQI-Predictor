services:
  # Python FastAPI ML Service
  - type: web
    name: aqi-ml-service
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # Node.js Express Backend
  - type: web
    name: aqi-express-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: aqi-ml-service
          property: host
